config:
  aws:region: eu-central-1
  selectauto-infra:projectName: selectauto
  selectauto-infra:environment: prod
  selectauto-infra:auctionsApiBaseUrl: https://auctionsapi.com/api
  selectauto-infra:hourlySyncScheduleExpression: rate(1 hour)
  selectauto-infra:dailyReferenceSyncScheduleExpression: rate(1 day)
  selectauto-infra:logRetentionDays: "14"
  selectauto-infra:perPage: "1000"
  selectauto-infra:incrementalMinutes: "75"
  # Secrets are NOT stored here. Set them once with the CLI (values live in the
  # repo-root .env); Pulumi encrypts them into this file against the stack's salt:
  #   pulumi config set --secret selectauto-infra:auctionsApiKey  <key>
  #   pulumi config set --secret selectauto-infra:neonDatabaseUrl <pooled-neon-url>

